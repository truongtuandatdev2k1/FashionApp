# file: FashionApp_uiAdmin/ui_mobile_fashion_app/pubspec.yaml
name: ui_mobile_fashion_app
description: "A simple fashion mobile app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  flutter_gen: ^5.12.0
  go_router: ^16.2.4
  get_it: ^8.2.0
  shared_preferences: ^2.5.3
  dio: ^5.9.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.5
  carousel_slider: ^5.1.1
  cached_network_image: ^3.4.1
  provider: ^6.1.5+1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.10.1
  flutter_gen_runner: ^5.12.0



flutter:

  uses-material-design: true

  # --- Phần Assets đã được thêm vào ---
  assets:
    - assets/customer/
    - assets/customer/images/
#    - assets/admin/
#    - assets/common/
#    - assets/fonts/ # Ví dụ cho fonts
    - assets/

# --- THÊM CẤU HÌNH flutter_gen Ở ĐÂY ---
flutter_gen:
  # Chỉ định đường dẫn và tên file code sẽ được tạo ra.
  # Tôi đề xuất đặt nó trong thư mục constants chung của bạn.
  output: lib/core/constants/assets.dart

  # Cài đặt độ dài dòng code được tạo
  line_length: 80

  # Cấu hình cho tệp Assets
  assets:
    # Loại trừ các file không cần thiết
    exclude:
      - .DS_Store

  # Cấu hình tích hợp nếu bạn sử dụng các loại file đặc biệt
  integrations:
    flutter_svg: true # Bật nếu bạn sử dụng file .svg
    lottie: false     # Bật nếu bạn sử dụng animation Lottie