  api.CreatePromotionRequest:
    properties:
      applicable_tiers:
        example:
        - gold
        - silver
        items:
          type: string
        type: array
      applicable_users:
        example:
        - 101
        - 102
        items:
          type: integer
        type: array
      code:
        example: SALE50
