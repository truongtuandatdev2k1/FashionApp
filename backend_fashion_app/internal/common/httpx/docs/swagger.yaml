        minimum: 0
        type: number
      name:
        example: Giảm 50k cho đơn hàng trên 500k
        type: string
      start_date:
        example: "2025-11-01T00:00:00Z"
        type: string
      target_group:
        enum:
        - all
        - new_customer
        - specific_users
        - customer_tier
        example: all, new_customer, specific_users, customer_tier
        type: string
      type:
        enum:
        - order_fixed
        - order_percentage
        - shipping_fixed
        - free_shipping
        example: order_fixed, order_percentage, shipping_fixed, free_shipping
        type: string
      usage_limit:
        example: 1000
        minimum: 0
        type: integer
      user_usage_limit:
        example: 1
        minimum: 0
        type: integer
      value:
        example: 50000
        type: number
    required:
    - code
    - end_date
    - name
    - start_date
    - target_group
    - type
    - value
    type: object
