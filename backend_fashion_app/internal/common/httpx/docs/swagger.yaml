      created_at:
        type: string
      product_color_id:
        type: integer
      product_id:
        type: integer
      size_code:
        type: string
      sku:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
      variant_id:
        type: integer
    type: object
  api.AppliedPromotion:
