basePath: /api/v1
definitions:
  api.CustomerUpsert:
    properties:
      address:
        type: string
      age:
        type: integer
      full_name:
        type: string
      gender:
        type: string
    required:
    - address
    - age
    - full_name
    - gender
    type: object
  api.GoogleLoginRequest:
    properties:
      idToken:
        type: string
    type: object
  api.LoginRequest:
    properties:
      credential:
        type: string
      password:
        type: string
    type: object
  api.RefreshRequest:
    properties:
      refreshToken:
        type: string
    type: object
  api.RegisterRequest:
    properties:
      confirmPassword:
        type: string
      email:
        example: alice@gmail.com
        format: email
        type: string
      password:
        type: string
      phone_number:
        type: string
    required:
    - confirmPassword
    - email
    - password
    - phone_number
    type: object
  api.ShopUpsert:
    properties:
      address:
        type: string
      shop_name:
        type: string
    required:
    - address
    - shop_name
    type: object
  api.UpsertProfileRequest:
    properties:
      customer:
        $ref: '#/definitions/api.CustomerUpsert'
      shop:
        $ref: '#/definitions/api.ShopUpsert'
    type: object
  resp.Envelope:
    properties:
      code:
        type: string
      data: {}
      message:
        type: string
    type: object
info:
  contact: {}
  description: Auth (local, Google) + Profile (customer/shop)
  title: MyFashion API
  version: "1.0"
paths:
  /auth/google:
    post:
      consumes:
      - application/json
      description: Xác thực Google ID Token; nếu chưa có user thì tạo (role=customer)
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resp.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/resp.Envelope'
      summary: Login Google
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Đăng nhập local (email/password)
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resp.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/resp.Envelope'
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      description: Thu hồi tất cả refresh token của người dùng hiện tại
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resp.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/resp.Envelope'
      security:
      - Bearer: []
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      description: Lấy info hiện tại từ JWT
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resp.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/resp.Envelope'
      security:
      - Bearer: []
      summary: Me
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Đổi refresh token lấy access token mới (rotate)
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resp.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/resp.Envelope'
      summary: Refresh access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Đăng ký tài khoản customer (chỉ customer, shop được cấp thủ công)
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/resp.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/resp.Envelope'
      summary: Register
      tags:
      - Auth
  /profiles/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resp.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/resp.Envelope'
      security:
      - Bearer: []
      summary: Get my profile
      tags:
      - Profile
    put:
      consumes:
      - application/json
      description: Tạo hoặc cập nhật hồ sơ cho người dùng hiện đang được xác thực.
        Nội dung yêu cầu phải chứa đối tượng 'khách hàng' hoặc 'cửa hàng', tùy thuộc
        vào vai trò của người dùng.
      parameters:
      - description: Profile data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.UpsertProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resp.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/resp.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/resp.Envelope'
      security:
      - Bearer: []
      summary: Upsert my profile
      tags:
      - Profile
schemes:
- http
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
