    - Đơn hàng mới tạo
    - Shop đã xác nhận
    - Đang chuẩn bị hàng
    - Đang giao hàng
    - Đã giao hàng
    - Đã hủy
    - Đã trả hàng
    x-enum-varnames:
    - OrderStatusPending
    - OrderStatusConfirmed
    - OrderStatusProcessing
